    ${s.sources && s.sources.length ? `<div class="sec"><h4>Sources</h4>${s.sources.map(src => `<div class="src"><a href="${esc(src.u)}" target="_blank" rel="noopener">${esc(src.t)}</a></div>`).join('')}</div>` : ''}`;
  openSheet(`<span class="row"><span class="num" style="width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:${catColor(s.cat)}">${s.n}</span>${esc(s.name)}</span>`, body, { sub: `Stage ${s.n} of ${STAGES.length}`, onMount: sheet => {
    $$('#st-seg button', sheet).forEach(b => b.addEventListener('click', () => { const ns = b.dataset.st; const r2 = st(id); if (ns === 'live' || ns === 'building') { if (!r2.startedAt) r2.startedAt = todayISO(); } if (ns === 'idle') r2.startedAt = null; r2.status = ns; saveNow(); toast(`Stage ${s.n}: ${STATUS[ns]}`); openStage(id); }));
    $$('[data-step]', sheet).forEach(b => b.addEventListener('click', () => { const r2 = st(id); const d = +b.dataset.d; const q2 = schedule(s); if (b.dataset.step === 'start') { const ns = clamp(q2.start + d, 0, 23); r2.startMonth = ns; if (r2.startedAt) { const dt = monthDate(S.settings.startDate, ns); r2.startedAt = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-01`; } } else { const stored = r2.sunsetMonth != null ? r2.sunsetMonth : (s.plan.sunset == null ? 25 : s.plan.sunset); const nv = stored + d; r2.sunsetMonth = nv >= 25 ? null : clamp(nv, 1, 24); } saveNow(); openStage(id); }));
    $$('#checks input', sheet).forEach(c => c.addEventListener('change', () => { const r2 = st(id); r2.checks[c.dataset.chk] = c.checked; save(); }));
    $$('[data-kpi]', sheet).forEach(inp => inp.addEventListener('input', () => { const r2 = st(id); r2.kpis[inp.dataset.kpi] = inp.value === '' ? '' : +inp.value; save(); }));
    const notes = $('#stage-notes', sheet); notes.addEventListener('input', () => { st(id).notes = notes.value; save(); });
    $('#add-for-stage', sheet).addEventListener('click', () => openEntry({stage:id}));
  }});
}

function openEntry(preset={}){
  const body = `
    <div class="seg lg" id="type-seg" style="display:flex;margin-bottom:14px"><button type="button" class="${preset.type !== 'expense' ? 'on' : ''}" data-t="income" style="flex:1">Income</button><button type="button" class="${preset.type === 'expense' ? 'on' : ''}" data-t="expense" style="flex:1">Cost</button></div>
    <div class="field"><label>Amount ($)</label><input id="e-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
    <div class="field"><label>Stage</label><select id="e-stage"><option value="">General / unassigned</option>${STAGES.map(s => `<option value="${s.id}" ${preset.stage === s.id ? 'selected' : ''}>${s.n} · ${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Date</label><input id="e-date" type="date" value="${todayISO()}"></div>
    <div class="field"><label>Note</label><input id="e-note" type="text" placeholder="Client, product, platform…" maxlength="80"></div>
    <button type="button" class="btn money block" id="e-save">Save entry</button>`;
  openSheet('Log an entry', body, { onMount: sheet => {
    let type = preset.type === 'expense' ? 'expense' : 'income';
    $$('#type-seg button', sheet).forEach(b => b.addEventListener('click', () => { type = b.dataset.t; $$('#type-seg button', sheet).forEach(x => x.classList.toggle('on', x === b)); }));
    $('#e-save', sheet).addEventListener('click', () => { const amt = parseFloat($('#e-amt', sheet).value); if (!(amt > 0)) { toast('Enter an amount'); $('#e-amt', sheet).focus(); return; } const date = $('#e-date', sheet).value || todayISO(); S.ledger.push({ id: uid(), ts: Date.now(), type, amount: Math.round(amt * 100) / 100, stage: $('#e-stage', sheet).value || null, date, note: $('#e-note', sheet).value.trim() }); saveNow(); ledgerMonth = monthIdx(date, S.settings.startDate); toast(`${type === 'income' ? 'Income' : 'Cost'} logged: ${fmtMoney(amt, {cents:true})}`); closeSheet(); });
    setTimeout(() => $('#e-amt', sheet).focus(), 250);
  }});
}

function openSettings(){
  const s = S.settings; const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone; const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const body = `
    <div class="sec"><h4>Your time</h4><div class="row" style="justify-content:space-between"><div><b>Hours per week</b><div class="xs muted">The forecast throttles stages to this.</div></div><div class="stepper"><button type="button" id="h-dn" aria-label="Fewer">−</button><b id="h-val">${s.hoursPerWeek} h</b><button type="button" id="h-up" aria-label="More">+</button></div></div></div>
    <div class="sec"><h4>Plan</h4><div class="field"><label>Month 0 of the plan</label><input type="month" id="s-start" value="${s.startDate.slice(0,7)}"><div class="hint">Stage schedules and the forecast count months from here.</div></div>
      <div class="field"><label>Default scenario</label><div class="seg lg" id="s-sc" style="display:flex">${SCEN.map((x, i) => `<button type="button" class="${i === scenario() ? 'on' : ''}" data-sc="${i}" style="flex:1">${x.long}</button>`).join('')}</div></div></div>
    <div class="sec"><h4>Data</h4><div class="grid2"><button type="button" class="btn" id="copy-bk">Copy backup</button><button type="button" class="btn" id="exp">Save backup file</button><button type="button" class="btn" id="imp">Import file</button><button type="button" class="btn" id="paste-bk">Restore pasted</button></div><input type="file" id="imp-file" accept="application/json" class="sr"><div class="field" style="margin:10px 0 0"><label for="bk-box">Backup text</label><textarea id="bk-box" placeholder="Paste a backup here, then tap Restore pasted"></textarea></div><div class="hint xs muted" style="margin-top:6px">Everything lives in this browser. Copy a backup before switching devices.</div><button type="button" class="btn danger block" id="reset" style="margin-top:10px">Reset all progress</button></div>
    <div class="sec"><h4>Install on your phone</h4>${standalone ? '<div class="notice money small">Installed. Opens full-screen and works offline.</div>' : ios ? '<div class="notice small">In Safari: tap <b>Share</b> → <b>Add to Home Screen</b>. It opens full-screen and works offline.</div>' : `<div class="notice small" id="install-note">${deferredInstall ? '<button type="button" class="btn primary block" id="install-btn">Install app</button>' : 'In Chrome: menu → <b>Add to Home screen</b> (or “Install app”).'}</div>`}</div>
    <div class="xs muted" style="text-align:center">Cascade · data v${esc(DATA.meta.version)} · ${S.ledger.length} ledger entries</div>`;
  openSheet('Settings', body, { onMount: sheet => {
    const upd = () => { $('#h-val', sheet).textContent = S.settings.hoursPerWeek + ' h'; save(); syncScenario(); };
    $('#h-dn', sheet).addEventListener('click', () => { S.settings.hoursPerWeek = clamp(S.settings.hoursPerWeek - 1, 2, 60); upd(); });
    $('#h-up', sheet).addEventListener('click', () => { S.settings.hoursPerWeek = clamp(S.settings.hoursPerWeek + 1, 2, 60); upd(); });
    $('#s-start', sheet).addEventListener('change', e => { if (/^\d{4}-\d{2}$/.test(e.target.value)) { S.settings.startDate = e.target.value + '-01'; ledgerMonth = null; save(); toast('Plan start updated'); } });
    $$('#s-sc button', sheet).forEach(b => b.addEventListener('click', () => { S.settings.scenario = +b.dataset.sc; save(); syncScenario(); $$('#s-sc button', sheet).forEach(x => x.classList.toggle('on', x === b)); }));
    const restore = text => { let obj; try { obj = JSON.parse(text); } catch(err){ toast('That is not a Cascade backup'); return; } if (!obj || !obj.settings || !Array.isArray(obj.ledger)) { toast('That is not a Cascade backup'); return; } askConfirm(`Replace everything here with this backup (${obj.ledger.length} ledger entries)?`, 'Replace', () => { S = obj; normalize(); saveNow(); ledgerMonth = null; syncScenario(); toast('Backup restored'); closeSheet(); }); };
    $('#exp', sheet).addEventListener('click', () => { const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cascade-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); });
    $('#copy-bk', sheet).addEventListener('click', async () => { const json = JSON.stringify(S); const box = $('#bk-box', sheet); try { await navigator.clipboard.writeText(json); toast('Backup copied'); } catch(err){ box.value = json; box.focus(); box.select(); toast('Select the text and copy it'); } });
    $('#paste-bk', sheet).addEventListener('click', () => restore($('#bk-box', sheet).value));
    $('#imp', sheet).addEventListener('click', () => $('#imp-file', sheet).click());
    $('#imp-file', sheet).addEventListener('change', e => { const file = e.target.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => restore(rd.result); rd.readAsText(file); });
    $('#reset', sheet).addEventListener('click', () => askConfirm('Erase all statuses, notes and ledger entries in this browser? This cannot be undone.', 'Erase all', () => { try { localStorage.removeItem(KEY); } catch(err){} S = DEFAULT(); ledgerMonth = null; syncScenario(); toast('Reset'); closeSheet(); }));
    const ib = $('#install-btn', sheet); if (ib) ib.addEventListener('click', async () => { if (!deferredInstall) return; deferredInstall.prompt(); const r = await deferredInstall.userChoice; if (r.outcome === 'accepted') toast('Installing…'); deferredInstall = null; });
  }});
}

/* ---------------- routing & boot ---------------- */
const VIEWS = { home: renderHome, flow: renderFlow, ledger: renderLedger, forecast: renderForecast, research: renderResearch };
let current = 'home';
function go(view, push=true){ if (!VIEWS[view]) view = 'home'; current = view; $$('.view').forEach(x => x.classList.toggle('active', x.id === 'view-' + view)); $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view)); $('#fab').classList.toggle('show', view === 'ledger'); VIEWS[view](); window.scrollTo({top:0}); if (push && location.hash !== '#' + view) { try { history.replaceState(null, '', '#' + view); } catch(e){} } }
function renderCurrent(){ VIEWS[current](); }
function route(){ const h = (location.hash || '#home').slice(1); const [view, arg] = h.split('/'); if (arg) { try { history.replaceState(null, '', '#' + (view === 'stage' ? 'flow' : view)); } catch(e){} } if (view === 'stage' && arg) { go('flow', false); openStage(arg); return; } go(VIEWS[view] ? view : 'home', false); if (view === 'ledger' && arg === 'add') openEntry(); }
function syncScenario(){ $('#scenario-label').textContent = SCEN[scenario()].label; $('#top-sub').textContent = `${SCEN[scenario()].long} · ${S.settings.hoursPerWeek} h/wk`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
document.addEventListener('click', e => { const b = e.target.closest('[data-open-stage]'); if (b) { e.preventDefault(); openStage(b.dataset.openStage); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-open-stage]')) openStage(e.target.dataset.openStage); });
$$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.view)));
$('#fab').addEventListener('click', () => openEntry());
$('#settings-btn').addEventListener('click', openSettings);
$('#scenario-chip').addEventListener('click', () => { S.settings.scenario = (scenario() + 1) % 3; save(); syncScenario(); toast(`${SCEN[scenario()].long} scenario`); renderCurrent(); });
let lastW = window.innerWidth; window.addEventListener('resize', debounce(() => { if (window.innerWidth !== lastW && !sheetOpen) { lastW = window.innerWidth; renderCurrent(); } }, 200));
let deferredInstall = null; window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
try { if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){} }); } } catch(e){}
load(); syncScenario(); route();
window.CASCADE = { state: () => S, forecast, DATA };
})();

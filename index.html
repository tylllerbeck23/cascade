<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cascade</title>
<meta name="description" content="A ten-stage side-hustle waterfall where every stage feeds the next. Track status, log revenue and forecast what the whole cascade can generate.">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cascade">
<style>
:root{
  --bg:#0b1020;--bg2:#0e1527;--panel:#121a2e;--panel2:#182238;--panel3:#1f2b47;
  --ink:#eef2ff;--ink2:#b6c0d9;--ink3:#7d88a6;--ink4:#55607c;
  --hair:rgba(255,255,255,.07);--hair2:rgba(255,255,255,.13);
  --brand:#38d1f0;--brand-ink:#06121c;--brand-soft:rgba(56,209,240,.13);
  --money:#4fe3a0;--money-soft:rgba(79,227,160,.13);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --grid:#222b43;--axis:#2f3a57;
  --r:16px;--r2:12px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --tab-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--brand)}
#app{max-width:600px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--sat)) 16px 10px;background:rgba(11,16,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:9px;background:url(icon-192.png) center/cover;flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:500;margin-top:2px}
.chip-btn{border:1px solid var(--hair2);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--hair2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.icon-btn svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;padding:14px 16px calc(var(--tab-h) + var(--sab) + 28px)}
.view{display:none}.view.active{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- bottom tabs ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(14,21,39,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);padding-bottom:var(--sab)}
.tabbar .inner{display:flex;width:100%;max-width:600px}
.tab{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);background:none;border:0;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--brand)}

/* ---------- atoms ---------- */
.card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.card h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink4)}
.card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.muted{color:var(--ink3)}.soft{color:var(--ink2)}.small{font-size:12.5px}.xs{font-size:11.5px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack>*+*{margin-top:8px}
.hr{height:1px;background:var(--hair);margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--hair2);background:var(--panel2);color:var(--ink);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.money{background:var(--money);color:#06231a;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--serious);border-color:rgba(236,131,90,.35)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--panel3);color:var(--ink2);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.idle{color:var(--ink3)}
.pill.building{background:var(--brand-soft);color:var(--brand)}
.pill.live{background:rgba(12,163,12,.18);color:#4fd46a}
.pill.paused{background:rgba(250,178,25,.16);color:var(--warn)}
.pill.killed{background:rgba(208,59,59,.16);color:#f08a8a}
.pill.earning{background:var(--money-soft);color:var(--money)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--hair);color:var(--ink2)}
.tag .sw{width:9px;height:9px;border-radius:3px;flex:none}
.tag.link{cursor:pointer}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.swl{display:inline-block;width:14px;height:2px;border-radius:2px;flex:none}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--panel2);border:1px solid var(--hair)}
.notice.warn{border-color:rgba(250,178,25,.35);background:rgba(250,178,25,.08)}
.notice.info{border-color:rgba(56,209,240,.35);background:var(--brand-soft)}
.notice.money{border-color:rgba(79,227,160,.35);background:var(--money-soft)}

/* ---------- figures ---------- */
.hero{padding:18px 16px 16px;background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%)}
.hero .label{font-size:12.5px;color:var(--ink3);font-weight:600}
.hero .value{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px}
.hero .delta{font-size:13px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r2);padding:12px 13px;min-height:74px}
.tile .label{font-size:12px;color:var(--ink3);font-weight:600}
.tile .value{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.tile .delta{font-size:11.5px;color:var(--ink3);margin-top:4px}
.tile .delta.up{color:var(--money)}
.meter{height:6px;border-radius:999px;background:rgba(56,209,240,.18);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.meter.over>i{background:var(--warn)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair);min-height:52px}
.item:first-child{border-top:0}
.item .num{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600;font-size:14.5px;line-height:1.25}
.item .sub{font-size:12px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt.in{color:var(--money)}.item .amt.out{color:var(--serious)}
.item.tap{cursor:pointer}
.chev{color:var(--ink4);flex:none}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- stage cards (flow view) ---------- */
.stage{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative}
.stage .head{display:flex;align-items:flex-start;gap:12px}
.stage .num{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.stage .name{font-weight:700;font-size:15.5px;line-height:1.2}
.stage .tagline{font-size:12.5px;color:var(--ink3);margin-top:3px}
.stage .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stage .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair)}
.stage .nums b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stage .nums span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.connector{height:14px;width:2px;background:var(--hair2);margin:-6px 0 -4px 30px;position:relative;z-index:1}

/* ---------- flow map ---------- */
.map{width:100%;height:auto;display:block;overflow:visible}
.map text{font-family:var(--sans);fill:var(--ink)}
.map .lbl{font-size:12.5px;font-weight:600}
.map .cat{font-size:10.5px;fill:var(--ink3);font-weight:600}
.map .edge{fill:none;stroke-width:2;opacity:.6;stroke-linecap:round}
.map .node{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend button.k{background:none;border:0;color:inherit;font:inherit;padding:2px 0}
.legend button.k.off{opacity:.4;text-decoration:line-through}

/* ---------- charts ---------- */
.chart-card{position:relative}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.chart-head h2{margin:0;flex-direction:column;align-items:flex-start;gap:2px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--hair);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink3);font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;min-height:28px}
.seg button.on{background:var(--panel3);color:var(--ink)}
.seg.lg button{padding:9px 12px;font-size:13px;min-height:38px}
.plot{position:relative;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.plot .grid line{stroke:var(--grid);stroke-width:1}
.plot .axis line{stroke:var(--axis);stroke-width:1}
.plot text{font-family:var(--sans);font-size:10.5px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.plot .xh{stroke:var(--ink3);stroke-width:1;opacity:0}
.tip{position:absolute;z-index:5;pointer-events:none;background:#0b1224;border:1px solid var(--hair2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.8);min-width:140px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .t{font-weight:700;color:var(--ink2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:1px 0}
.tip .r b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tip .r span{color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
table.tv{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.tv th{text-align:right;font-weight:600;color:var(--ink3);padding:6px 6px;border-bottom:1px solid var(--hair2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
table.tv th:first-child,table.tv td:first-child{text-align:left}
table.tv td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--hair)}
.tv-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.spark{display:block}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(3,6,14,.6);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:600px;max-height:92dvh;background:var(--bg2);border:1px solid var(--hair2);border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--hair2);margin:10px auto 0}
.sheet .sh{display:flex;align-items:flex-start;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--hair)}
.sheet .sh .ttl{flex:1;min-width:0}
.sheet .sh h2{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.sheet .sh .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(16px + var(--sab));overscroll-behavior:contain}
.sec{margin-bottom:16px}
.sec h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.sec p{font-size:14px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:9px 10px}
.kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--brand);margin-top:1px;flex:none}
.check span{font-size:14px;color:var(--ink)}
.check input:checked+span{color:var(--ink3);text-decoration:line-through}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--hair2);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:90px;resize:vertical;line-height:1.4}
.field .hint{font-size:11.5px;color:var(--ink4);margin-top:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--hair2);border-radius:12px;background:var(--panel);overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:transparent;font-size:18px;color:var(--ink2)}
.stepper b{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.src{font-size:12.5px;color:var(--ink3);padding:6px 0;border-top:1px solid var(--hair);word-break:break-word}
.src:first-child{border-top:0}
.src a{color:var(--brand);text-decoration:none}
details.acc{border-top:1px solid var(--hair)}
details.acc:first-of-type{border-top:0}
details.acc summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin-left:auto;margin-right:4px;transition:transform .15s}
details.acc[open] summary::after{transform:rotate(-135deg)}
details.acc .acc-body{padding:0 0 12px}
ul.b{padding-left:18px;color:var(--ink2);font-size:13.5px}
ul.b li{margin:4px 0}
.md h1,.md h2,.md h3,.md h4{margin:16px 0 6px;line-height:1.25}
.md h1{font-size:19px}.md h2{font-size:16px}.md h3{font-size:14.5px}.md h4{font-size:13.5px;color:var(--ink2)}
.md p{font-size:13.5px;color:var(--ink2);margin:6px 0}
.md ul,.md ol{padding-left:18px;font-size:13.5px;color:var(--ink2);margin:6px 0}
.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:5px}
.md table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--hair);padding:5px 6px;text-align:left;vertical-align:top}
.md th{color:var(--ink3);font-weight:600}
.md blockquote{border-left:3px solid var(--hair2);padding-left:10px;color:var(--ink3);margin:6px 0}
.md hr{border:0;border-top:1px solid var(--hair);margin:12px 0}
.md a{word-break:break-word}

.fab{position:fixed;right:max(16px,calc((100vw - 600px)/2 + 16px));bottom:calc(var(--tab-h) + var(--sab) + 16px);z-index:25;width:54px;height:54px;border-radius:18px;background:var(--money);color:#06231a;border:0;box-shadow:0 14px 30px -10px rgba(79,227,160,.6);display:none;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.fab.show{display:flex}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 18px);transform:translateX(-50%) translateY(10px);background:#0b1224;border:1px solid var(--hair2);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.confirm{position:fixed;inset:0;z-index:70;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm .box{background:var(--bg2);border:1px solid var(--hair2);border-radius:16px;padding:16px;width:100%;max-width:360px}
.confirm p{font-size:15px;margin-bottom:14px}
.confirm .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill.behind{background:rgba(236,131,90,.16);color:var(--serious)}
.pill.ahead{background:var(--money-soft);color:var(--money)}
.track{position:relative;height:12px;border-radius:999px;background:var(--panel3);margin:10px 0 8px;overflow:visible}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--money)}
.track>b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink2)}
.track-legend{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:600px){.hero .value{font-size:54px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>

  "reportMd": "# Sell Services First, Let Products Compound Later\n\nFor a Pennsylvania college student who is good with Claude Code, has 10–15 hours a week and less than $500, the AI side hustles that reliably make money in late 2026 are the ones that sell time or outcomes. Those are AI-training gigs (realistically $14–$45 an hour, not the $75–$80 medians in listings), fixed-price Claude Code builds sold on Upwork and Contra, and automation retainers for local businesses at about $500 setup plus $99–$300 a month. Products, audiences and SaaS still work, but their measured medians are small. Of 10,150 listed indie products, 26.1% never earned anything and the median earner made $169 in 30 days. Only 2.3% of Gumroad products have ever sold. Those stages belong later, built from the code, clients and proof the service stages produce. I ran the ten-stage plan already in the Cascade dashboard through the dashboard's own forecast engine. The base case gives about **$7,200 of revenue in year one and $27,000 in year two**: roughly $34,000 over 24 months, ending at about $3,000 a month. The low case is $1,500 then $6,000. The high case is $21,600 then $94,000. Services (stages 1, 2 and 4) produce **90% of base revenue in year one and 60% over 24 months**. For scale, the median US side hustle earns $200 a month and only 14% earn more than $1,000. The base case's roughly $1,200 a month at month 12 is therefore a top-seventh result, and the low case is closer to what a typical attempt earns. Year one pays about **$11.50 per hour worked**, less than steady gig work would. The plan's case rests on year two and on assets the operator owns: an email list, reusable code and a SaaS that can be sold. The evidence is uneven. Platform and government data are strong, most income stories are self-reported, and two of the seven research tracks were cut short. Treat every per-stage number as a planning estimate, not a measured median.\n\n## The median side hustle earns $200 a month, and an \"AI\" label does not raise it\n\nThe best starting point is the base rate. Bankrate's 2025 survey, checked at the source, found **27% of US adults have a side hustle, median income $200 a month, average $885, and only 14% earn more than $1,000 a month**. Gen Z was the least likely generation to clear even $100 a month (45%) ([Bankrate](https://www.bankrate.com/press-releases/fewer-americans-have-a-side-hustle-in-2025/)). LendingTree's March 2026 survey reports a higher average of $1,242 but no median. It also shows 56% of side hustlers work 5–15 hours a week, the same budget as this plan ([LendingTree](https://www.lendingtree.com/debt-consolidation/side-hustle-income-survey/)). The gap between average and median is the main lesson: a few large earners pull the average up and most people earn little.\n\nAI tooling does not change that distribution. A September 2026 census of all 10,150 products listed on TrustMRR found **49.3% of AI products earning versus 49.0% of non-AI products, and 3.8% versus 3.9% at $5,000+ MRR**. Overall, 26.1% had never earned, the median earner took in $169 in 30 days, and the top 1% of products captured 76.1% of all revenue ([TechStartups](https://techstartups.com/2026/09/28/what-percentage-of-indie-hacker-products-make-100k-in-arr/)). Age matters more than technology. Among products under three months old, 44% had never earned and about 1% were at $5,000 MRR. Among products over four years old, 19% had reached $5,000 MRR, although those are survivors. Subscription apps tell the same story. RevenueCat's data on 115,000+ apps shows **17.3% of new apps reach $1,000 a month within two years, and the median app earns about $72 a month a year after launch** ([RevenueCat](https://www.revenuecat.com/state-of-subscription-apps/)). On Gumroad, the median seller has earned about $90 lifetime and the median paid price is $7 ([Profitable.app](https://profitable.app/gumroad/stats)). In 2023 data, only 35% of newsletters published a second issue ([Reletter](https://reletter.com/blog/newsletter-fade/)).\n\nThe research keeps finding the same reason: AI compresses build time, not the time it takes to find buyers. One non-coder shipped three SaaS products in weeks on Claude Max and disclosed no revenue for any of them ([dev.to](https://dev.to/rikuq/claude-code-review-2026-from-zero-code-to-3-live-saas-203k)). A Claude Code and n8n \"agency\" built 25 templates, two MCP servers and 17 skills and had **$0 revenue and zero clients** when it posted about them ([dev.to](https://dev.to/krisying/how-im-building-a-one-person-ai-automation-agency-in-2026-tools-stack-revenue-3712)). Pieter Levels counts only 4 of his 70+ projects as having made money and grown ([dev.to](https://dev.to/idonthaveapen/failures-behind-a-420kmonth-solo-founder-i-read-all-751-of-pieter-levels-blog-posts-1h3b)). In the census, founders with 4+ products reached $5,000 MRR 14.1% of the time versus 5.0% with one product. That correlation supports making several bets. Pat Walls reported the opposite lesson: Starter Story's revenue tripled once he stopped splitting effort across about ten projects (secondary source) ([Indie Hackers](https://www.indiehackers.com/post/im-pat-walls-i-built-my-side-project-starterstory-to-profitability-and-quit-my-full-time-engineering-job-441d4cd5fe/)). The plan resolves this by sequencing: it runs ten stages over two years but never builds more than two at once.\n\n## Three stages pay within weeks; everything else pays in months\n\n### Training gigs pay $14–$45 an hour, in floods and droughts\n\nAI-lab training work is the fastest route to a first dollar at no cost. It is also the least stable. Listed coding rates are high: Outlier $27.50–$50, Mercor's engineering median $80.25, micro1 $75, and Handshake AI's median $80 across 246 listings ([aitrainer.work](https://aitrainer.work/guides/best-ai-training-platforms-developers-coders); [aitrainer.work](https://aitrainer.work/guides/handshake-ai-fellowship-guide)). Independent reports put **DataAnnotation at $14–$20 for general work and $25–$45 for coding**. The same reports describe 1–3 weeks to a first task, floods of work followed by weeks near zero, and deactivations without a clear appeal ([Talents for AI](https://talentsforai.com/blog/is-dataannotation-tech-legit/)). Pay can be cut quickly. Mercor moved a Meta project's workers from $21 to $16 an hour in November 2025 ([Futurism](https://futurism.com/artificial-intelligence/mercor-meta-ai-labor)). Outlier contractors reported repricing of 30–50% in 2026 ([aitrainer.work](https://aitrainer.work/news/scale-ai-fallout-surge-ai-hyper-growth)). A pending suit alleges 30,000+ Mercor workers were misclassified as contractors; these are allegations, not findings ([Law360](https://www.law360.com/tax-authority/articles/2475907)). Handshake requires workers to be 18+, US-based and to have an SSN or ITIN. Many of its listings ask for a degree, so a current undergraduate's access depends on the listing. The research team's planning model, which is not a measured median, is about $750 a month gross at 25 paid hours and $30 an hour, with drought months at $0–$250. Gigs leave cash and a working knowledge of where models fail. Platform confidentiality rules may limit how much of that knowledge can be shared publicly, so the plan keeps a private failure log and retires gigs at month 5.\n\n### Claude Code freelancing rides 109% growth in AI demand on a shrinking platform\n\nUpwork's 2026 skills report found **demand for AI skills grew 109% in 2025 versus 23% for other skills, with AI integration up 178% and chatbot development up 71%** ([Upwork](https://www.upwork.com/press/releases/upworks-in-demand-skills-2026-demand-for-top-ai-skills-more-than-doubles-as-ai-is-embedded-into-everyday-work)). The platform as a whole is shrinking. Q3 2026 gross services volume fell 10.1% to $914.1M and active clients fell to 717,000, while volume from freelancers with AI skills rose 55% ([Upwork Q3 2026](https://www.sec.gov/Archives/edgar/data/0001627475/000162747526000053/upwork3q26-pressrelease_3q.htm)). Fiverr's marketplace revenue fell 24.7% in the same quarter, and its management expects traffic to keep falling as AI-driven discovery replaces search ([Fiverr Q3 2026](https://www.sec.gov/Archives/edgar/data/0001762301/000117891326004897/exhibit_99-1.htm)). Commodity AI work is losing value. Generative creative contract starts rose 90% while per-contract earnings fell 13%, but freelancers doing complex AI work earned 45% more year over year ([Upwork Future Workforce Index via QuiverQuant](https://www.quiverquant.com/news/Upwork+Releases+2026+Future+Workforce+Index%2C+Finding+AI+Is+Reshaping+Freelance+Work+and+Earnings)). The conclusion is to sell integrations and dashboards, not generated content.\n\nGetting work is a numbers game. GigRadar's analysis of 133,872 proposals found **reply rates of 5.80% in web development and 7.21% in AI/ML**. Replies peaked at 8.99% for proposals sent four to five minutes after a job was posted and at 8.8% for bids within 5% of the client's budget ([GigRadar](https://gigradar.io/blog/upwork-market-report-2026)). Blogs and forums put the first client at 2–8 weeks and 15–80 proposals ([GigUp](https://giguphq.com/blog/how-long-does-it-take-to-get-your-first-upwork-client)). Upwork's fee has been variable at 0–15% (typically about 10%) since May 2025, and each proposal costs $0.60–$2.40 in Connects ([jobalerts.dev](https://jobalerts.dev/blog/upwork-fees)). Contra charges freelancers nothing and bills the client $19 per contract ([Contra](https://contra.com/commission-free)). A live expert-level Upwork automation post paid $30–$60 an hour ([Upwork](https://www.upwork.com/jobs/~022064749685465370305)). Fixed prices let Claude Code's speed turn into a higher effective hourly rate.\n\n### Local retainers turn one demo into recurring revenue\n\nMissed-call text-back and automated review requests are concrete, demo-able outcomes for dentists, contractors and salons. **Most such services sell for $99–$300 a month**, and SMS requires A2P registration (about $19.50 once plus $1.50–$3 a month) ([Quo](https://www.quo.com/blog/missed-call-text-back-software/)). The appeal is retention. Focus Digital's 2026 study measured retainer clients churning **2.47% a month, an average lifespan of about 40 months, versus 6.69% for project clients** ([Focus Digital](https://focus-digital.co/average-marketing-agency-churn/)). Demand is broad: 58% of small businesses used generative AI in 2025, up from 23% in 2023 ([IPWatchdog on the U.S. Chamber report](https://ipwatchdog.com/2025/08/18/us-chamber-report-small-businesses-rapidly-adopting-ai-despite-regulatory-concerns/)). The most detailed agency case is self-reported, comes from a site that sells courses, and is internally inconsistent. In it, the first client signed at month 3 for $500 plus $150 a month. Cold email to 40 local businesses got one reply, five of seven clients came from client 1's referrals, and the founder worked 60+ hours a week early on ([BeginnersinAI](https://beginnersinai.org/ai-agency-success-story/)). That is four to five times this operator's budget, which is why the plan's numbers sit far below that story. Cold email to local services averages about a 3.4% reply rate ([Mailshake](https://mailshake.com/blog/cold-email-benchmarks-2026/)). The plan therefore relies on in-person demos and referrals. Focus Digital's data has a warning: 60% of small businesses that leave cite lack of ROI, so each retainer needs a before-and-after number.\n\n### Audience stages earn little directly but raise every later stage\n\nNewsletters have the shortest documented path to first revenue: **a median of 66 days to the first dollar** for beehiiv newsletters launched in 2025 ([beehiiv](https://www.beehiiv.com/blog/the-state-of-newsletters-2026)). Paid tiers are weak. The median free-to-paid conversion is 0.62%, about $62 a month per 1,000 subscribers at $10. The AI niche churns 13.33% a month, which works out to an average paid lifetime of roughly 7.5 months ([beehiiv](https://www.beehiiv.com/blog/the-state-of-paid-newsletters-2026)). Sponsorship on small lists sells at about $15–$35 CPM. The beehiiv Ad Network needs 2,500 subscribers ([beehiiv](https://www.beehiiv.com/blog/newsletter-sponsorship-cost)). The median list grows 3.5% a month ([Newsletter Benchmarks](https://newsletterbenchmark.com/)). The list's real job is distribution for every later launch, and beehiiv is free up to 2,500 subscribers.\n\nA free niche tool is the one search play that still works. Search for articles is in decline. Pages with an AI Overview get **58% fewer clicks at position 1** ([Ahrefs](https://ahrefs.com/blog/ai-overviews-reduce-clicks-update/)), and 68% of US Google searches ended without a click in early 2026 ([SparkToro](https://sparktoro.com/blog/in-2026-less-than-one-third-of-google-searches-still-send-a-click/)). Calculators and converters are much harder for AI to summarize away. Ahrefs documents low-difficulty openings such as \"etsy fee calculator\" (keyword difficulty 7) and also warns the edge will narrow as tools get trivially easy to build ([Ahrefs](https://ahrefs.com/blog/the-free-tools-seo-strategy/)). Users are not revenue. The median Chrome extension has 18 users, 70.4% have 100 or fewer ([Konabayev](https://konabayev.com/blog/extension-monetization-statistics-2026/)), and one extension with 40,000 daily users showed $0 revenue (search summary only) ([TrustMRR](https://trustmrr.com/startup/60-000-weekly-users-40-000-daily-users-chrome-extension-3-years-old-no-maintenance)).\n\nAffiliate links take almost no extra hours. Recurring SaaS programs pay far better than retail ones. **Beehiiv and Kit pay 50% of referred revenue for 12 months, HubSpot pays 30% for a year with a 180-day cookie, and ElevenLabs pays 22%** ([beehiiv](https://academy.beehiiv.com/p/partner-program); [Kit](https://kit.com/affiliate); [HubSpot](https://www.hubspot.com/partners/affiliates); [ElevenLabs](https://elevenlabs.io/affiliate)). Notion is not accepting new affiliates ([Notion](https://www.notion.com/affiliates)). The conservative conversion figure is 0.8% of referrals becoming sales over 90 days ([Rewardful](https://www.rewardful.com/articles/state-of-saas-affiliate-programs-report)). Warm email traffic does better, which is why this stage comes after the list exists.\n\n### Product stages have long tails and small medians\n\nTemplate packs only work in narrow niches. The median paid Notion template on Gumroad has earned **about $520 lifetime, and 49% earned under $500** ([InsightRaider](https://insightraider.com/en/answers/how-much-can-you-make-selling-notion-templates-on-gumroad)). Profession-specific templates face little competition: top therapist templates show 8–45 reviews against 1,000+ for generic ones, at $25–$79 (vendor scan) ([Kupkaike](https://kupkaike.com/blog/is-selling-notion-templates-still-profitable-2026)). On October 22, 2026, Etsy banned standalone AI prompt bundles and AI-written instructions and began requiring an unedited real photo on listings ([GreenOnion](https://greenonion.ai/blog/etsy-copyright-ai-images); [Digital Commerce 360](https://www.digitalcommerce360.com/2026/10/26/etsy-ai-policy/)). One correction to the shipped plan: it names Lemon Squeezy (5% + 50¢) as a storefront, but Lemon Squeezy's own team says it is migrating users to Stripe Managed Payments and admits to slower support ([Lemon Squeezy](https://www.lemonsqueezy.com/blog/2026-update)). Payhip's free plan (5% plus processor fees, with US sales tax handled) is the safer default ([Payhip](https://payhip.com/pricing)).\n\nA vertical micro-SaaS has the highest ceiling, and category choice matters. In the census, **Productivity and Utilities products reached $5,000 MRR only 0.6% and 0.5% of the time, against 8.0% for mobile, 6.0% for e-commerce and 4.9% for marketing**. Products above $5,000 MRR charged a $37 median subscription versus $13 overall ([TechStartups](https://techstartups.com/2026/09/28/what-percentage-of-indie-hacker-products-make-100k-in-arr/)). Running costs are low. Vercel Pro ($20) plus Supabase's free tier covers launch, and a paid product cannot use Vercel's non-commercial Hobby plan ([Vercel](https://vercel.com/pricing); [Supabase](https://supabase.com/pricing)). The real cost risk is model usage. Sonnet 5.5 costs $2/$10 per million input/output tokens and Haiku 5.5 costs $0.10/$0.50 ([Anthropic](https://platform.claude.com/docs/en/about-claude/pricing)). A billing vendor's model shows flat \"unlimited\" plans losing money on power users, and 3–5x markups with usage caps holding 70–85% margins ([Dodo Payments](https://dodopayments.com/blogs/ai-wrapper-business-model-monetization/)).\n\nCourses and exits come last because their evidence is the thinnest. Claude Club charges $97 a month and had 526 members on October 31, 2026, down from 546 in August ([AI Funnel Insider](https://aifunnelinsider.com/claude-club-skool-review-2026/)). Profitable.app models Skool communities under 100 members at about $450–$500 a month, as an upper bound ([Profitable.app](https://profitable.app/skool/stats)). Justin Welsh's first course made $10,482 in its first month. He launched it at 20,000+ followers, after consulting had already earned him $880K (self-reported) ([Welsh thread](https://threadreaderapp.com/thread/1453029782631895043.html)). No independent income data exists for Claude Code educators. On exits, small SaaS listings ask a median 2.0x revenue or 3.4x profit. That comes from one secondary source whose page could not be opened ([BigIdeasDB](https://bigideasdb.com/state-of-saas-valuations-2026)). At those multiples, a product at $1,000 MRR is worth roughly $24,000–$39,000. Tony Dinh sold Xnapper at about $4,000 MRR for $150K, and sold Black Magic at $14,000 MRR for only $128K after Twitter repriced its API ([Supabird](https://supabird.io/articles/tony-dinh-from-a-105k-developer-to-a-1-million-indie-hacking-marvel)).\n\n## Seven popular AI hustles fail the screen\n\nSeveral heavily marketed AI hustles fail on the platform's own rules or on measured payout data. They are left out of the plan.\n\n| Hustle | Deciding fact | Verdict |\n|---|---|---|\n| Faceless YouTube | From Feb 1, 2027 new channels need 8,000 watch hours or 20M Shorts views ([YouTube](https://support.google.com/youtube/answer/12843009)); median RPM $2.30 ([AIR](https://air.io/en/air-data-findings/which-youtube-niche-makes-the-most-money-in-2026-ranked-by-real-rpm-and-cpm)) | Out |\n| TikTok/Reels payouts | 10K followers to join; 76% of creators average under 1K views a post ([DIW](https://www.digitalinformationworld.com/2026/03/creator-economy-report-515-of-creators.html)) | Funnel only |\n| AI stock images/music | Shutterstock and Pond5 ban contributor AI ([Shutterstock](https://submit.shutterstock.com/help/en/articles/10594622-content-policy-updates-ai-generated-content); [Pond5](https://contributor.pond5.com/getting-started/legal-guidelines/)) | Closed |\n| Paid MCP servers/skills | Vendor estimate: median server earns $0, under 5% earn anything ([DEV](https://dev.to/nicolas_fainstein/the-state-of-mcp-monetization-in-2026-28i4)) | Lead magnet only |\n| GitHub bounties | 64.1% of bounty-labeled issues paid $0; a 40-hour test earned $0 ([DEV](https://dev.to/zeroknowledge0x/i-analyzed-1000-github-bounty-issues-heres-what-actually-pays-and-whats-a-waste-of-time-geb)) | Portfolio only |\n| Print-on-demand | $3–$8 net per shirt; 124–274 shirts a month for $1K profit ([Printful](https://www.printful.com/blog/how-much-money-can-custom-t-shirts-make)) | Out |\n| Podcasts | Median episode gets 27–28 first-week downloads ([Buzzsprout](https://www.buzzsprout.com/stats)) | Out |\n\nYouTube's July 2025 \"inauthentic content\" rule explicitly demonetizes templated, mass-produced AI output ([YouTube](https://support.google.com/youtube/answer/1311392)). Faceless channels are therefore both slow and at policy risk. X ended Creator Revenue Sharing in September 2026, and LinkedIn has no payout program. Both are useful for reaching people, not for revenue ([OpenTweet](https://opentweet.io/blog/x-original-content-rewards-2026)). ElevenLabs voice licensing has paid $22M+ across 10,400+ creators ([ElevenLabs](https://elevenlabs.io/blog/22-million-earned-by-voice-creators-on-elevenlabs)). That works out to about $2,115 cumulative per earning creator, skewed by top voices, and licensing exposes your voice to synthetic reuse that cannot be undone. It is a small optional side bet, not a stage.\n\n## The ten-stage cascade turns $92 of setup into a $3,000-a-month base case by month 24\n\nThe order follows the documented sequence of operators who succeeded: services first, then audience, then products. Daniel Vassallo freelanced about 20 hours a month as an income floor before his ebook made about $40K in two weeks ([Vassallo thread](https://threadreaderapp.com/thread/1495838991752384513.html)). Of Justin Welsh's first $1.3M, $880K came from consulting, and the audience he built to win consulting work later became the market for his course ([Welsh thread](https://threadreaderapp.com/thread/1453029782631895043.html)). Rob Walling's stair-step method reaches SaaS only after smaller products fund it ([MicroConf](https://microconf.com/latest/the-stairstep-approach-to-bootstrapping)). The shipped plan applies this to ten stages. Each stage hands the next cash, code, a niche, a list or proof. Start dates are plan months, where month 0 is November 2026.\n\n| Stage (start month) | Base 24-mo revenue | Main output | Feeds |\n|---|---|---|---|\n| 1 AI gigs (0, ends 5) | $1,000 | Cash, failure log | 2, 3 |\n| 2 Freelance builds (0) | $8,900 | Code, niche, reviews | 3, 4, 5, 8 |\n| 3 Newsletter (1) | $3,400 | Owned list | 5, 7, 8, 9 |\n| 4 Local retainers (2) | $10,700 | Recurring revenue, SaaS spec | 3, 5, 8 |\n| 5 Template packs (5) | $2,500 | Buyers, course modules | 3, 9 |\n| 6 Free niche tool (6) | $500 | Signups, search traffic | 3, 7, 8 |\n| 7 Affiliate links (7) | $800 | Commissions | — |\n| 8 Vertical micro-SaaS (8) | $4,600 | A sellable asset | 3, 9, 10 |\n| 9 Cohort course (14) | $1,700 | Referrals | 2, 7 |\n| 10 Reinvest and exit (18) | $0 | Capital | 8 |\n\nThese figures come from running the plan's own data through the dashboard's forecast engine. For each stage, the engine interpolates low, base and high monthly revenue anchors at months 3, 6 and 12 and applies a month-24 growth factor. Each mature upstream stage adds a \"feed\" boost, capped at 1.75x, and revenue is throttled if the plan ever needs more than the 12-hour weekly budget. Tool costs are subtracted. Taxes are not, and revenue is meant to be stated net of platform fees.\n\n| Scenario | Year 1 | Year 2 | Month-24 rate |\n|---|---|---|---|\n| Low | $1,450 | $6,030 | $630/mo |\n| Base | $7,210 | $27,000 | $2,980/mo |\n| High | $21,640 | $93,920 | $10,860/mo |\n\nFive features of the forecast matter more than the totals. First, the plan fits the time budget: demand peaks at exactly 12 hours a week and never exceeds it, because stage 1 retires as stages 5–8 start. Raising the budget to 15 hours changes nothing; the extra hours are slack. Second, the money requirement is trivial. Setup costs total $92 across all stages, tool costs run $682 in year one and $840 in year two, and cumulative net turns positive in month 1 in the base case and month 3 in the low case. Third, **the waterfall itself adds about $5,300, or 18%, to the base 24-month total**: the same stages with no feeds would earn $28,900. Almost all of that premium lands in year two, when the list and the client niche have matured. Fourth, services carry the plan. Freelancing and retainers alone produce $19,600 of the $34,200, and the retainer stage is the single largest line, so whether retainers sign by month 5 is the leading indicator for the whole forecast. Fifth, effort pays badly at first. At 12 hours a week, about 624 hours a year, base year one returns roughly $11.50 an hour and year two about $43. Pure gig work at the research team's $30 effective rate would beat year one in cash. The plan deliberately trades year-one income for assets the operator owns.\n\nThose assets explain why the base case can reach about $3,000 a month by month 24, but the base case is not the typical outcome. Its month-12 run rate of about $1,200 a month would place the operator among the 14% of side hustlers who clear $1,000 ([Bankrate](https://www.bankrate.com/press-releases/fewer-americans-have-a-side-hustle-in-2025/)). The low case's $280 a month at month 12 sits near the national median. Several growth factors also assume compounding that the evidence does not guarantee: the newsletter, affiliate and exit stages each double between months 12 and 24. Budget around the low case and treat the base case as the target. The plan's kill rules are the safeguard. Examples include fewer than two paid projects after 60 proposals, zero retainers after 40 real conversations, under $300 MRR six months after the SaaS launches, and a full restart in a new niche if no stage clears $500 a month by month 12. Write those rules down before each stage starts and enforce them.\n\n## Pennsylvania rules, taxes and failure modes cost little to respect and a lot to ignore\n\nThe tool stack fits inside the budget. Claude Pro is $20 a month ($17 billed annually) and includes Claude Code. Max ($100) and Ultra ($200) raise the usage limits, but their bundled API credits cannot be used inside Claude Code ([Claude pricing](https://claude.com/pricing); [Claude support](https://support.claude.com/en/articles/11145838-using-claude-code-with-your-pro-or-max-plan)). A .com domain costs $11.81 a year ([Porkbun](https://porkbun.com/products/domains)). The lean stack runs about $21 a month, and $500 of starting capital covers a year of it with room left over.\n\nTaxes start sooner than most students expect. Self-employment tax is **15.3% once net earnings reach $400** ([IRS](https://www.irs.gov/businesses/small-businesses-self-employed/self-employment-tax-social-security-and-medicare-taxes)). For 2026, platforms issue a 1099-NEC only at $2,000 and a 1099-K only above $20,000 and 200 transactions, but all income is reportable whether or not a form arrives ([IRS 1099-K](https://www.irs.gov/businesses/understanding-your-form-1099-k); [IRS 1099-NEC instructions](https://www.irs.gov/instructions/i1099mec)). Quarterly estimates apply once you expect to owe $1,000 or more ([IRS](https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes)). Pennsylvania adds 3.07% personal income tax ([PA Revenue](https://www.pa.gov/agencies/revenue/resources/tax-rates)). Local earned-income tax was not researched. Under third-party guides, SaaS is subject to Pennsylvania's 6% sales tax while most services are exempt, which matters when stage 8 launches ([Anrok](https://anrok.com/saas-sales-tax-by-state/pennsylvania)). A Pennsylvania LLC costs $125 plus a $7 annual report, and an EIN is free ([PA DOS](https://www.pa.gov/en/agencies/dos/programs/business/fees-and-payments.html); [IRS](https://www.irs.gov/businesses/small-businesses-self-employed/get-an-employer-identification-number)). Nothing requires an LLC to start, so forming one once revenue is real is reasonable. The plan's 25–30% set-aside turns base year one's $6,500 net of tools into about $4,600–$4,900 you can spend.\n\nLegal exposure is mostly about honesty and disclosure. Anthropic's consumer terms require users to be 18+, assign outputs to the user, and prohibit reselling the service or sharing accounts ([Consumer Terms](https://www.anthropic.com/legal/consumer-terms)). Its usage policy requires consumer-facing chatbots to disclose that the user is talking to AI. That applies directly to any retainer bot that texts a dentist's patients. The policy also bans fake reviews and manipulating search results ([Anthropic AUP](https://www.anthropic.com/legal/aup)). The FTC's rule makes AI-generated fake reviews a civil-penalty violation ([FTC](https://www.ftc.gov/news-events/news/press-releases/2024/08/federal-trade-commission-announces-final-rule-banning-fake-reviews-testimonials)), and affiliate links need a plain label such as \"Paid link\" next to the recommendation ([FTC](https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking)). Copyright protection for AI output is thin. The D.C. Circuit held that copyright requires a human author, and the Supreme Court declined review on March 2, 2026 ([D.C. Circuit](https://media.cadc.uscourts.gov/opinions/docs/2025/03/23-5233.pdf); [SCOTUSblog](https://www.scotusblog.com/cases/case-files/thaler-v-perlmutter)). The Copyright Office says prompts alone do not make someone the author ([USCO](https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf)). Template packs and generated code are protected only in their human-made selection, arrangement and edits. The defensible advantages are the niche, the list and speed, not copyright.\n\nThe documented ways this goes wrong are mostly avoidable. Anthropic's entry API tier caps spend at $500 a month; set your own lower limit and never put an API key in client-side code ([Anthropic](https://platform.claude.com/docs/en/api/rate-limits)). Stripe charges $15 per dispute, and Visa's monitoring program flags merchants at as few as 5 disputes and a 0.5% dispute ratio. Clear billing terms and easy cancellation on the SaaS are the main defense ([Stripe](https://stripe.com/pricing); [Stripe docs](https://docs.stripe.com/disputes/monitoring-programs)). Platform dependence is the risk every stage shares: gig repricing, Etsy's October rule changes, Lemon Squeezy's migration, and Black Magic's forced sale all show it. Keeping the email list and the code under your own control is the hedge built into the plan.\n\n## Conclusion\n\nThe research changes what the cascade is. It is not ten side hustles in parallel. It is a small services business, gigs then freelancing then retainers, whose by-products are converted step by step into assets: reusable code becomes templates, the questions clients repeat pick the SaaS, and the record of shipping becomes a newsletter. The evidence shows AI makes the building nearly free but does nothing for distribution, so the stages that create distribution (the list, referrals, an installed client base) matter more than any product idea. The honest comparison for year one is steady gig income, which the cascade does not beat. The cascade earns its place in year two, in a SaaS worth an estimated $24,000–$39,000 if it reaches $1,000 MRR, and in a list that carries forward into the next attempt.\n\nTwo signals tell an operator early which scenario they are in: signed retainers by month 5 and about 300 subscribers by month 8. Hitting both makes the base case credible. Missing both means the low case, about $7,500 over two years, which is still more than the median side hustler earns and comes with code and a list kept. The biggest open uncertainties are outside the operator's control. Upwork and Fiverr are shrinking even as AI work grows, training-gig pay is being cut, and none of the self-reported $20K+ MRR Claude Code stories has been independently verified. Plan around the median and treat any upside as a bonus.\n"

  items.forEach(it => { const b = document.createElement(onToggle ? 'button' : 'span'); b.className = 'k' + (it.off ? ' off' : ''); const k = document.createElement('i'); k.className = it.kind === 'rect' ? 'sw' : 'swl'; k.style.background = it.color; b.appendChild(k); b.appendChild(document.createTextNode(it.name)); if (onToggle) { b.type = 'button'; b.addEventListener('click', () => onToggle(it.id)); } l.appendChild(b); });
  container.appendChild(l); return l;
}
/* Line chart: series = [{id,name,color,kind:'line'|'band'|'dots',values:[] | [[lo,hi],...]}] */

  cfg.series.filter(s => s.kind === 'line').forEach(s => { let d = ''; let started = false; s.values.forEach((v, i) => { if (v == null) { started = false; return; } d += (started ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1); started = true; }); if (d) svg.appendChild(el('path', {d, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round'})); const last = s.values.map((v,i)=>[v,i]).filter(p=>p[0]!=null).pop(); if (last && s.endDot) svg.appendChild(el('circle', {cx: xs(last[1]), cy: ys(last[0]), r:4, fill:s.color, stroke:'var(--panel)', 'stroke-width':2})); });
  cfg.series.filter(s => s.kind === 'dots').forEach(s => { s.values.forEach((v, i) => { if (v == null) return; svg.appendChild(el('circle', {cx: xs(i), cy: ys(v), r:4, fill:s.color, stroke:'var(--panel)', 'stroke-width':2})); }); let d = ''; let started = false; s.values.forEach((v, i) => { if (v == null) { started = false; return; } d += (started ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1); started = true; }); if (d) svg.insertBefore(el('path', {d, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round'}), svg.lastChild); });

/* Column chart: stacks = [{id,name,color,values:[]}] (single stack may be negative) */
function columnChart(container, cfg){
  container.innerHTML = ''; container.classList.add('plot');
  const W = Math.max(280, container.clientWidth || 340), H = cfg.height || 200;
  const padL = 44, padR = 10, padT = 10, padB = 26; const iw = W - padL - padR, ih = H - padT - padB;
  const n = cfg.x.length; const slot = iw / n; const bw = Math.min(24, slot * 0.62); const gap = 2;
  const vis = cfg.stacks.filter(s => !s.off);
  let max = 0, min = 0; for (let i = 0; i < n; i++){ let pos = 0, neg = 0; vis.forEach(s => { const v = s.values[i] || 0; if (v >= 0) pos += v; else neg += v; }); max = Math.max(max, pos); min = Math.min(min, neg); }
  const tp = max > 0 ? niceTicks(max, min < 0 ? 3 : 4) : (min < 0 ? [0] : niceTicks(100, 4)), tn = min < 0 ? niceTicks(-min, 2).map(v => -v).reverse() : [0];
  const top = tp[tp.length-1] || 1, bot = tn[0] || 0; const span = top - bot || 1; const ys = v => padT + (top - v) / span * ih;
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:'img', 'aria-label': cfg.aria || 'chart'});
  const grid = el('g', {class:'grid'}); const ticks = Array.from(new Set([...tn, ...tp])).sort((a,b)=>a-b); ticks.forEach(t => { if (t !== 0) grid.appendChild(el('line', {x1:padL, x2:W-padR, y1:ys(t), y2:ys(t)})); svg.appendChild(txt(padL-6, ys(t)+3.5, fmtAxis(t), {'text-anchor':'end'})); }); svg.appendChild(grid);
  const every = n > 14 ? 3 : n > 8 ? 2 : 1; cfg.x.forEach((lab, i) => { if ((n - 1 - i) % every === 0) svg.appendChild(txt(padL + slot*i + slot/2, H-8, lab, {'text-anchor':'middle'})); });
  const bars = el('g');
  for (let i = 0; i < n; i++){ const x = padL + slot*i + (slot - bw)/2; let accP = 0, accN = 0; const segs = vis.map(s => ({s, v: s.values[i] || 0})).filter(o => o.v !== 0);
    const lastPos = segs.filter(o => o.v > 0).pop(); const lastNeg = segs.filter(o => o.v < 0).pop();
    segs.forEach(o => { if (o.v > 0){ const y0 = ys(accP), y1 = ys(accP + o.v); const h = Math.max(0, y0 - y1 - (accP > 0 ? gap : 0)); const y = y1; const d = o === lastPos ? roundTop(x, y, bw, h, 4) : (h > 0 ? `M${x},${y}h${bw}v${h}h${-bw}Z` : ''); if (d) bars.appendChild(el('path', {d, fill:o.s.color})); accP += o.v; }
      else { const y0 = ys(accN), y1 = ys(accN + o.v); const h = Math.max(0, y1 - y0 - (accN < 0 ? gap : 0)); const y = y0 + (accN < 0 ? gap : 0); const d = o === lastNeg ? roundBottom(x, y, bw, h, 4) : (h > 0 ? `M${x},${y}h${bw}v${h}h${-bw}Z` : ''); if (d) bars.appendChild(el('path', {d, fill:o.s.color})); accN += o.v; } });
  }
  svg.appendChild(bars);
  svg.appendChild(el('line', {class:'axis', x1:padL, x2:W-padR, y1:ys(0), y2:ys(0), stroke:'var(--axis)'}));
  const hl = el('rect', {x:0, y:padT, width:slot, height:ih, fill:'#fff', 'fill-opacity':0}); svg.appendChild(hl);
  const hit = el('rect', {x:padL, y:0, width:iw, height:H, fill:'transparent'}); svg.appendChild(hit);
  container.appendChild(svg);
  const tip = makeTip(container);
  const show = clientX => { const rect = svg.getBoundingClientRect(); const px = (clientX - rect.left) * (W / rect.width); const i = clamp(Math.floor((px - padL) / slot), 0, n-1); hl.setAttribute('x', padL + slot*i); hl.setAttribute('fill-opacity', .05);
    const rows = vis.map(s => ({name:s.name, color:s.color, kind:'rect', value: fmtMoney(s.values[i] || 0)})); if (cfg.extra) rows.push(...cfg.extra(i)); if (vis.length > 1) rows.push({name:'Total', color:'transparent', kind:'rect', value: fmtMoney(vis.reduce((a,s)=>a+(s.values[i]||0),0))});
    tip.innerHTML = ''; tip.appendChild(tipRows(cfg.xLong ? cfg.xLong[i] : cfg.x[i], rows)); tip.classList.add('on'); placeTip(tip, container, (padL + slot*i + slot/2) * (rect.width / W)); };
  const hide = () => { tip.classList.remove('on'); hl.setAttribute('fill-opacity', 0); };
  hit.addEventListener('pointermove', e => show(e.clientX)); hit.addEventListener('pointerdown', e => show(e.clientX)); hit.addEventListener('pointerleave', hide);
  if (cfg.stacks.length > 1) legend(container, cfg.stacks.map(s => ({id:s.id, name:s.name, color:s.color, kind:'rect', off:s.off})), cfg.onToggle);
}
function tableView(container, headers, rows){
  container.innerHTML = ''; const wrap = document.createElement('div'); wrap.className = 'tv-wrap'; const t = document.createElement('table'); t.className = 'tv';
  const thr = document.createElement('tr'); headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; thr.appendChild(th); }); t.appendChild(thr);
  rows.forEach(r => { const tr = document.createElement('tr'); r.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }); t.appendChild(tr); });
  wrap.appendChild(t); container.appendChild(wrap);
}
function sparkline(values, color, w=84, h=24){
  const max = Math.max(...values, 1e-9); const n = values.length; const xs = i => (n > 1 ? i * (w - 4) / (n - 1) : 0) + 2; const ys = v => h - 3 - (v / max) * (h - 6);
  let d = ''; values.forEach((v, i) => d += (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1));
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" opacity=".9"/><circle cx="${xs(n-1).toFixed(1)}" cy="${ys(values[n-1]).toFixed(1)}" r="2.5" fill="${color}"/></svg>`;
}
/* chart card with chart/table toggle */
function chartCard(mount, {title, sub, render, table}){

  card.innerHTML = `<div class="chart-head"><h2>${esc(title)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ''}</h2><div class="seg" role="tablist"><button type="button" class="on" data-m="chart">Chart</button><button type="button" data-m="table">Table</button></div></div><div class="body"></div>`;
  const body = card.querySelector('.body'); let mode = 'chart';
  const draw = () => { if (mode === 'chart') { body.classList.add('plot'); render(body); } else { body.classList.remove('plot'); body.innerHTML = ''; const t = table(); tableView(body, t.headers, t.rows); } };
  card.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; card.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); draw(); }));

}

let mapSel = null;
function drawMap(mount){
  const W = Math.max(280, mount.clientWidth || 340); const rowH = 50; const railX = Math.round(W * 0.42); const H = rowH * STAGES.length + 10;
  const svg = el('svg', {class:'map', viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:'img', 'aria-label':'Cascade map: stages and what feeds what'});
  const ny = i => 25 + i * rowH;
  const edges = []; STAGES.forEach((s, i) => (s.feeds || []).forEach(e => { const j = STAGES.findIndex(x => x.id === e.to); if (j >= 0) edges.push({i, j, color: catColor(s.cat), what: e.what}); }));
  const maxR = Math.min(W - railX - 54, 130), maxL = railX - 84;
  const eg = el('g');
  edges.forEach(ed => { const y0 = ny(ed.i), y1 = ny(ed.j); const dist = Math.abs(ed.j - ed.i); const fwd = ed.j > ed.i; const bulge = Math.min(fwd ? maxR : maxL, 16 + dist * 12); const bx = fwd ? railX + bulge : railX - bulge;
    const sel = mapSel != null && (ed.i === mapSel || ed.j === mapSel); const dim = mapSel != null && !sel;
    eg.appendChild(el('path', {class:'edge', d:`M${railX},${y0} C${bx},${y0} ${bx},${y1} ${railX},${y1}`, stroke: ed.color, 'stroke-width': sel ? 3 : 1.6, opacity: dim ? .1 : sel ? 1 : .5})); });
  svg.appendChild(eg);
  STAGES.forEach((s, i) => { const r = st(s.id); const sel = mapSel === i; const dim = mapSel != null && !sel; const g = el('g', {class:'node', 'data-map-sel': i, tabindex:0, role:'button', 'aria-label': `Stage ${s.n}: ${s.name}`, opacity: dim ? .55 : 1});
    g.appendChild(el('circle', {cx: railX, cy: ny(i), r: 23, fill:'transparent'}));
    g.appendChild(el('circle', {cx: railX, cy: ny(i), r: sel ? 15 : 13, fill: r.status === 'idle' ? 'var(--panel3)' : catColor(s.cat), stroke: sel ? '#fff' : catColor(s.cat), 'stroke-width': 2}));
    g.appendChild(txt(railX, ny(i) + 4.2, String(s.n), {'text-anchor':'middle', style:`font-size:11.5px;font-weight:800;fill:${r.status === 'idle' ? 'var(--ink2)' : '#fff'}`}));

    svg.appendChild(g); });
  mount.innerHTML = ''; mount.appendChild(svg);

  if (mapSel == null) { cap.textContent = 'Tap a stage to see what it feeds and what feeds it. Arcs to the right flow down the waterfall; arcs to the left flow back up.'; }
  else { const s = STAGES[mapSel]; const feeds = (s.feeds || []).map(e => `${BY_ID[e.to].n} (${e.what})`); const fb = fedBy(s.id).map(f => { const e = f.feeds.find(x => x.to === s.id); return `${f.n} (${e.what})`; });
    cap.innerHTML = `<div class="between"><b>${s.n} · ${esc(s.name)}</b><button type="button" class="btn sm primary" data-open-stage="${s.id}">Open</button></div><div class="soft" style="margin-top:4px">${feeds.length ? `<b>Feeds</b> → ${esc(feeds.join(', '))}` : '<b>Terminal stage</b>: it consumes, it does not feed'}${fb.length ? `<br><b>Fed by</b> ← ${esc(fb.join(', '))}` : ''}</div>`; }
  mount.appendChild(cap);
  $$('[data-map-sel]', svg).forEach(g => { const h = () => { const i = +g.getAttribute('data-map-sel'); mapSel = mapSel === i ? null : i; drawMap(mount); }; g.addEventListener('click', h); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h(); } }); });

/* tiny markdown renderer (trusted, authored content) */
function md(src){
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r/g, '').split('\n'); let out = ''; let i = 0;
  while (i < lines.length){ const L = lines[i];
    if (/^\s*$/.test(L)) { i++; continue; }
    let m;
    if ((m = L.match(/^(#{1,4})\s+(.*)/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(L)) { out += '<hr>'; i++; continue; }
    if (/^\|/.test(L)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; } const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const body = rows.filter(r => !/^\|\s*:?-{2,}/.test(r)); out += '<table>' + body.map((r, ri) => '<tr>' + cells(r).map(c => `<${ri === 0 ? 'th' : 'td'}>${inline(c)}</${ri === 0 ? 'th' : 'td'}>`).join('') + '</tr>').join('') + '</table>'; continue; }
    if (/^\s*[-*]\s+/.test(L)) { out += '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`; i++; } out += '</ul>'; continue; }
    if (/^\s*\d+[.)]\s+/.test(L)) { out += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; i++; } out += '</ol>'; continue; }
    if (/^>\s?/.test(L)) { let q = ''; while (i < lines.length && /^>\s?/.test(lines[i])) { q += lines[i].replace(/^>\s?/, '') + ' '; i++; } out += `<blockquote>${inline(q)}</blockquote>`; continue; }
    let p = ''; while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|\||\s*[-*]\s|\s*\d+[.)]\s|>)/.test(lines[i])) { p += lines[i] + ' '; i++; } out += `<p>${inline(p.trim())}</p>`;
  }
  return out;
}

/* ---------------- confirm dialog ---------------- */
function askConfirm(message, yesLabel, onYes){
  const old = $('.confirm'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'confirm'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true');
  const box = document.createElement('div'); box.className = 'box';
  const p = document.createElement('p'); p.textContent = message;
  const acts = document.createElement('div'); acts.className = 'acts';
  const no = document.createElement('button'); no.type = 'button'; no.className = 'btn'; no.textContent = 'Cancel';
  const yes = document.createElement('button'); yes.type = 'button'; yes.className = 'btn danger'; yes.textContent = yesLabel;
  no.addEventListener('click', () => d.remove());
  yes.addEventListener('click', () => { d.remove(); onYes(); });
  d.addEventListener('click', e => { if (e.target === d) d.remove(); });
  acts.append(no, yes); box.append(p, acts); d.appendChild(box); document.body.appendChild(d); no.focus();
}

/* ---------------- sheets ---------------- */
let sheetOpen = false, sheetPushed = false, sheetTitle = '', skipPop = false;
function openSheet(title, bodyHTML, {sub='', onMount} = {}){
  const wasOpen = sheetOpen, wasPushed = sheetPushed, sameSheet = wasOpen && title === sheetTitle;
  const prevScroll = wasOpen && $('.sheet .sb') ? $('.sheet .sb').scrollTop : 0;
  closeSheet(true); sheetPushed = wasPushed; sheetTitle = title;
  const root = $('#sheet-root');
  root.innerHTML = `<div class="backdrop" id="backdrop"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh"><div class="ttl"><h2>${title}</h2>${sub ? `<div class="small muted" style="margin-top:3px">${sub}</div>` : ''}</div><button type="button" class="x" id="sheet-x" aria-label="Close">✕</button></div><div class="sb">${bodyHTML}</div></div>`;
  if (wasOpen) { $('#backdrop').style.transition = 'none'; $('.sheet').style.transition = 'none'; }
  void root.offsetHeight; $('#backdrop').classList.add('on'); $('.sheet').classList.add('on');
  $('#backdrop').addEventListener('click', () => closeSheet()); $('#sheet-x').addEventListener('click', () => closeSheet());
  sheetOpen = true; if (!sheetPushed) { try { history.pushState({sheet:1}, ''); sheetPushed = true; } catch(e){} }
  if (onMount) onMount(root.querySelector('.sheet'));
  if (sameSheet) root.querySelector('.sb').scrollTop = prevScroll;
}
function closeSheet(silent){
  const root = $('#sheet-root'); if (!sheetOpen) { root.innerHTML = ''; return; }
  sheetOpen = false; root.innerHTML = '';
  if (sheetPushed && !silent) { sheetPushed = false; skipPop = true; setTimeout(() => { skipPop = false; }, 400); try { history.back(); } catch(e){ skipPop = false; } } else sheetPushed = false;
  renderCurrent();
}
window.addEventListener('popstate', () => { if (skipPop) { skipPop = false; return; } if (sheetOpen) { sheetPushed = false; closeSheet(true); } else route(); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; const c = $('.confirm'); if (c) { c.remove(); return; } if (sheetOpen) closeSheet(); });

function openStage(id){

  const k = SCEN[sc].k === 'lo' ? 0 : SCEN[sc].k === 'hi' ? 2 : 1;

    <div class="sec"><p><b>${esc(s.tagline)}</b></p><p style="margin-top:6px">${esc(s.why)}</p></div>
    <div class="sec"><h4>Numbers · ${esc(SCEN[sc].label)} case</h4><div class="kv">
      <div><b>${fmtMoney(s.rev.m3[k])}</b><span>Month 3 /mo</span></div><div><b>${fmtMoney(s.rev.m6[k])}</b><span>Month 6 /mo</span></div><div><b>${fmtMoney(s.rev.m12[k])}</b><span>Month 12 /mo</span></div>
      <div><b>${s.ttfd[0]}–${s.ttfd[1]} wk</b><span>First dollar</span></div><div><b>${fmtMoney(s.setup)} + ${fmtMoney(s.monthly)}/mo</b><span>Cost</span></div><div><b>${s.hours.build}→${s.hours.run}→${s.hours.maint}</b><span>h/wk build·run·keep</span></div>
    </div><div class="xs muted" style="margin-top:6px">Low · base · high at month 12: ${fmtMoney(s.rev.m12[0])} · ${fmtMoney(s.rev.m12[1])} · ${fmtMoney(s.rev.m12[2])} per month. Cascade projection for this stage in ${monLY(cm+11)}: <b>${fmtMoney(f.months[cm+11].byStage[id] || 0)}</b>/mo (includes feeding boosts and your hours cap).</div></div>
    <div class="sec"><h4>Schedule</h4><div class="row" style="flex-wrap:wrap;gap:10px">
      <div><div class="xs muted" style="margin-bottom:4px">Planned start</div><div class="stepper"><button type="button" data-step="start" data-d="-1" aria-label="Earlier">−</button><b id="start-val">Month ${q.start}</b><button type="button" data-step="start" data-d="1" aria-label="Later">+</button></div></div>
      <div><div class="xs muted" style="margin-bottom:4px">Sunset</div><div class="stepper"><button type="button" data-step="end" data-d="-1" aria-label="Earlier">−</button><b id="end-val">${storedEnd != null ? 'Month ' + storedEnd : 'Never'}</b><button type="button" data-step="end" data-d="1" aria-label="Later">+</button></div></div>
    </div><div class="xs muted" style="margin-top:6px">Month 0 = ${esc(monthLabel(S.settings.startDate, 0, true))}. Marking the stage Live replaces the planned start with the real date.</div></div>
    <div class="sec"><h4>Feeds</h4><div class="chips">${(s.feeds || []).length ? s.feeds.map(e => `<span class="row" style="gap:6px;width:100%;align-items:flex-start;padding:4px 0">${stageChip(e.to)}<span class="small soft" style="flex:1"><b>${esc(e.what)}</b> · ${esc(e.note || '')}</span></span>`).join('') : '<span class="small muted">Terminal stage: it consumes, it does not feed.</span>'}</div>
      ${fedBy(id).length ? `<h4 style="margin-top:10px">Fed by</h4><div class="chips">${fedBy(id).map(fs => stageChip(fs.id)).join('')}</div>` : ''}</div>
    <div class="sec"><h4>First moves</h4><div id="checks">${s.actions.map((a, i) => `<label class="check"><input type="checkbox" data-chk="${i}" ${r.checks[i] ? 'checked' : ''}><span>${esc(a)}</span></label>`).join('')}</div></div>
